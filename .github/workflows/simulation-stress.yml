name: Simulation Stress Test

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos-simulation:
    runs-on: ubuntu-latest
    # 3 attempts × (8m sim + 90s cooldown + ~1m setup) ≈ 32m worst case; 35m gives headroom.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build Simulation
        run: go build -o tmp/simulation ./test/simulation/cmd/simulation

      - name: Run Chaos Simulation
        # Retry up to 3 times to absorb residual chaos-timing flakiness. Each
        # attempt uses an independent random seed, so failures are independent.
        # Per-attempt logs are preserved on failure so every attempt is
        # diagnosable from the uploaded artifact.
        run: |
          set +e
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "::group::Simulation attempt $attempt/$max_attempts"
            ./tmp/simulation \
              --config test/simulation/configs/chaos_comprehensive.yaml \
              --duration 8m \
              --cooldown 90s \
              --stop-on-failure=false \
              2>&1 | tee "tmp/simulation-attempt${attempt}.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Attempt $attempt succeeded"
              cp "tmp/simulation-attempt${attempt}.log" tmp/simulation.log
              exit 0
            fi
            echo "Attempt $attempt failed (exit $rc)"
          done
          # All attempts exhausted — surface the last attempt's log as the primary.
          cp "tmp/simulation-attempt${max_attempts}.log" tmp/simulation.log
          exit 1

      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-report
          path: |
            failure_report.json
            tmp/simulation.log
            tmp/simulation-attempt*.log

  network-disconnect-simulation:
    runs-on: ubuntu-latest
    # 3 attempts × (90s sim + 15s cooldown + ~1m setup) ≈ 8m worst case; 12m gives headroom.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Simulation
        run: go build -o tmp/simulation ./test/simulation/cmd/simulation
      - name: Run Network-Disconnect Simulation
        # Focused 90s config exercising both random and leader-targeted
        # network-disconnect chaos events. Same 3-retry pattern as the
        # comprehensive job to absorb timing flakes.
        run: |
          set +e
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "::group::Network-disconnect attempt $attempt/$max_attempts"
            ./tmp/simulation \
              --config test/simulation/configs/chaos_network_disconnect.yaml \
              --duration 90s \
              --cooldown 15s \
              --stop-on-failure=false \
              2>&1 | tee "tmp/network-attempt${attempt}.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Attempt $attempt succeeded"
              cp "tmp/network-attempt${attempt}.log" tmp/network.log
              exit 0
            fi
            echo "Attempt $attempt failed (exit $rc)"
          done
          cp "tmp/network-attempt${max_attempts}.log" tmp/network.log
          exit 1
      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: network-disconnect-failure-report
          path: |
            failure_report.json
            tmp/network.log
            tmp/network-attempt*.log

  roundrobin-simulation:
    runs-on: ubuntu-latest
    # 3 attempts × (90s sim + 20s cooldown + ~1m setup) ≈ 9m worst case; 12m gives headroom.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Simulation
        run: go build -o tmp/simulation ./test/simulation/cmd/simulation
      - name: Run RoundRobin Chaos Simulation
        # 90s RoundRobin assignment-strategy run under the comprehensive
        # chaos workload — surfaces RoundRobin-specific bugs that the
        # WeightedConsistentHash-only main job would miss.
        run: |
          set +e
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "::group::RoundRobin attempt $attempt/$max_attempts"
            ./tmp/simulation \
              --config test/simulation/configs/chaos_roundrobin.yaml \
              --duration 90s \
              --cooldown 20s \
              --stop-on-failure=false \
              2>&1 | tee "tmp/roundrobin-attempt${attempt}.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Attempt $attempt succeeded"
              cp "tmp/roundrobin-attempt${attempt}.log" tmp/roundrobin.log
              exit 0
            fi
            echo "Attempt $attempt failed (exit $rc)"
          done
          cp "tmp/roundrobin-attempt${max_attempts}.log" tmp/roundrobin.log
          exit 1
      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: roundrobin-failure-report
          path: |
            failure_report.json
            tmp/roundrobin.log
            tmp/roundrobin-attempt*.log

  gate-on-simulation:
    runs-on: ubuntu-latest
    # 3 attempts × (5m sim + 30s cooldown + ~1m setup) ≈ 22m worst case; 25m gives headroom.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Simulation
        run: go build -o tmp/simulation ./test/simulation/cmd/simulation
      - name: Run Gate-On Chaos Simulation
        # 5m run of chaos_gate.yaml — exercises enforce_exclusive_consumption
        # end-to-end under chaos. Validates the refined cross-worker
        # classifier (current-owner discriminator); zero ownership_violations,
        # concurrent_owners, inconclusive, and post-chaos unobserved
        # counters are the merge bar. See chaos_gate.yaml header for the
        # known heartbeat-watcher blind spot that is intentionally
        # out of scope for this job.
        run: |
          set +e
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "::group::Gate-on attempt $attempt/$max_attempts"
            ./tmp/simulation \
              --config test/simulation/configs/chaos_gate.yaml \
              --cooldown 30s \
              --stop-on-failure=false \
              2>&1 | tee "tmp/gate-on-attempt${attempt}.log"
            rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "Attempt $attempt succeeded"
              cp "tmp/gate-on-attempt${attempt}.log" tmp/gate-on.log
              exit 0
            fi
            echo "Attempt $attempt failed (exit $rc)"
          done
          cp "tmp/gate-on-attempt${max_attempts}.log" tmp/gate-on.log
          exit 1
      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-on-failure-report
          path: |
            failure_report.json
            tmp/gate-on.log
            tmp/gate-on-attempt*.log

  # ---------------------------------------------------------------------------
  # Sim-coverage-hardening per-pillar jobs (added 2026-05-27).
  #
  # Each job runs a small group of related scenarios sequentially in one
  # job so per-pillar runner-minutes stay bounded but the six pillars run
  # in parallel across runners. Scenarios use FIXED scheduled_events (not
  # random chaos), so they should pass deterministically without the
  # retry pattern the random-chaos jobs above use. If any scenario flakes
  # under runner load, raise its timeout first; only add retries if a
  # specific scenario has demonstrated non-determinism.
  # ---------------------------------------------------------------------------

  sim-bucket-lifecycle:
    runs-on: ubuntu-latest
    # 4 scenarios: 3 x ~3m + 90s + setup ~= 13m worst case; 18m gives headroom.
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Simulation
        run: go build -o tmp/simulation ./test/simulation/cmd/simulation
      - name: Run Bucket Lifecycle Scenarios
        # Phase 1 — exercises the manager's onClaimerError routing
        # boundary (peer-takeover vs whole-bucket-loss) plus the
        # bucket-recreate epoch fence.
        run: |
          set -eo pipefail
          for scn in chaos_bucket_delete chaos_bucket_recreate chaos_bucket_peer_takeover chaos_kv_unavailable; do
            echo "::group::${scn}"
            ./tmp/simulation \
              --config "test/simulation/configs/${scn}.yaml" \
              --stop-on-failure=false \
              2>&1 | tee "tmp/${scn}.log"
            echo "::endgroup::"
          done
      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-bucket-lifecycle-failure
          path: |
            failure_report.json
            tmp/chaos_bucket_*.log
            tmp/chaos_kv_unavailable.log

  sim-natskv-source:
    runs-on: ubuntu-latest
    # 2 scenarios × 4m + setup ≈ 9m worst case; 13m gives headroom.
    timeout-minutes: 13
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Simulation
        run: go build -o tmp/simulation ./test/simulation/cmd/simulation
      - name: Run NATSKV Source Scenarios
        # Phase 2 — exercises the empirically load-bearing reconciler
        # recovery path in internal/source/nats_kv.go and the composed
        # bucket-delete error surface.
        run: |
          set -eo pipefail
          for scn in chaos_natskv_source chaos_natskv_source_bucket_delete; do
            echo "::group::${scn}"
            ./tmp/simulation \
              --config "test/simulation/configs/${scn}.yaml" \
              --stop-on-failure=false \
              2>&1 | tee "tmp/${scn}.log"
            echo "::endgroup::"
          done
      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-natskv-source-failure
          path: |
            failure_report.json
            tmp/chaos_natskv_*.log

  sim-claim-loss-coverage:
    runs-on: ubuntu-latest
    # 4 scenarios: 3m + 90s + 90s + 2m ≈ 8m + setup ≈ 10m; 14m gives headroom.
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Simulation
        run: go build -o tmp/simulation ./test/simulation/cmd/simulation
      - name: Run Claim-Loss & Long-Disconnect Scenarios
        # Phase 3 (Gap 12) + Phase 4 (Gaps 3, 4, 8a-AIO) — long-disconnect
        # reassignment, direct stable-ID claim steal, tiny-pool stale
        # takeover, and MaxAge-expiry returning-worker self-stop.
        run: |
          set -eo pipefail
          for scn in chaos_network_disconnect_long chaos_stableid_claim_steal chaos_stableid_tiny_pool chaos_stableid_maxage_expiry; do
            echo "::group::${scn}"
            ./tmp/simulation \
              --config "test/simulation/configs/${scn}.yaml" \
              --stop-on-failure=false \
              2>&1 | tee "tmp/${scn}.log"
            echo "::endgroup::"
          done
      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-claim-loss-coverage-failure
          path: |
            failure_report.json
            tmp/chaos_network_disconnect_long.log
            tmp/chaos_stableid_*.log

  sim-publisher-handoff:
    runs-on: ubuntu-latest
    # 6 scenarios: 90s + 90s + 60s + 90s + 90s + 2m ~= 10m + setup ~= 11m; 16m gives headroom.
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Simulation
        run: go build -o tmp/simulation ./test/simulation/cmd/simulation
      - name: Run Publisher & Handoff Scenarios
        # Phase 5 (Gaps 10a, 10b) + Phase 6 (Gap 5) — producer disconnect,
        # assignment-commit CAS storm, handoff bucket MaxAge contract,
        # orphan stable-claim drift, and handoff claim write-fault recovery.
        run: |
          set -eo pipefail
          for scn in chaos_producer_disconnect chaos_assignment_cas_storm handoff_precreate_maxage handoff_orphan_stable_claim chaos_handoff_startup_write_fault chaos_handoff_version_write_fault; do
            echo "::group::${scn}"
            ./tmp/simulation \
              --config "test/simulation/configs/${scn}.yaml" \
              --stop-on-failure=false \
              2>&1 | tee "tmp/${scn}.log"
            echo "::endgroup::"
          done
      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-publisher-handoff-failure
          path: |
            failure_report.json
            tmp/chaos_producer_*.log
            tmp/chaos_assignment_*.log
            tmp/chaos_handoff_*.log
            tmp/handoff_*.log

  sim-process-mode:
    runs-on: ubuntu-latest
    # 2 scenarios: 45s + 4m ≈ 5m + setup ≈ 6m; 10m gives headroom.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Simulation
        run: go build -o tmp/simulation ./test/simulation/cmd/simulation
      - name: Run Process-Mode Scenarios
        # Phase 7 (Gaps 8b, 8c, 8a-OS) — process-mode IPC smoke +
        # SIGSTOP claim-loss takeover with same-pool replacement.
        run: |
          set -eo pipefail
          for scn in process_smoke chaos_process_sigstop_long; do
            echo "::group::${scn}"
            ./tmp/simulation \
              --config "test/simulation/configs/${scn}.yaml" \
              --stop-on-failure=false \
              2>&1 | tee "tmp/${scn}.log"
            echo "::endgroup::"
          done
      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-process-mode-failure
          path: |
            failure_report.json
            tmp/process_smoke.log
            tmp/chaos_process_sigstop_long.log

  sim-storage-residuals:
    runs-on: ubuntu-latest
    # 4 scenarios: three ~60s + heartbeat_scan_flatness ~285s ≈ 9m + setup;
    # 16m gives headroom.
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Simulation
        run: go build -o tmp/simulation ./test/simulation/cmd/simulation
      - name: Run Storage & Burst Scenarios
        # Phase 8 (Gaps 9, 13) — manager create-time StorageType assertion,
        # operator-precreated replicas, burst-after-quiet KV-op ceiling.
        # heartbeat_scan_flatness (FM7/FM3) — leader heartbeat scan-rate floor.
        run: |
          set -eo pipefail
          for scn in storage_assertion storage_replicas_operator burst_after_quiet heartbeat_scan_flatness; do
            echo "::group::${scn}"
            ./tmp/simulation \
              --config "test/simulation/configs/${scn}.yaml" \
              --stop-on-failure=false \
              2>&1 | tee "tmp/${scn}.log"
            echo "::endgroup::"
          done
      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-storage-residuals-failure
          path: |
            failure_report.json
            tmp/storage_*.log
            tmp/burst_*.log
            tmp/heartbeat_scan_flatness.log

  # ---------------------------------------------------------------------------
  # Label-assignment coverage (added 2026-07-09).
  #
  # Exercises the label-based (VIP) partition assignment feature under
  # concurrent chaos: pool-outage spill, live heartbeat relabeling that
  # races an in-flight rebalance/election, a multi-worker emergency
  # carveout, and a relabel storm. Unlike its sibling per-pillar jobs
  # above, this job builds the simulation binary with -race: developing
  # this coverage found and fixed about half a dozen real, pre-existing
  # concurrency bugs in the simulation harness itself, all invisible
  # without the race detector, so the coverage is only meaningful with it
  # on. Two of the four scenarios also drive random background chaos
  # (leader failures / disconnects) alongside their fixed schedule, so
  # some non-determinism is possible; per the policy above, raise the
  # timeout or add retries only if a specific scenario demonstrates
  # flakiness in CI.
  # ---------------------------------------------------------------------------

  sim-label-assignment:
    runs-on: ubuntu-latest
    # 4 scenarios: 90s + 3m + 2m30s + 90s = 8.5m raw scenario time. The
    # -race build is slower to compile and its higher CPU/memory pressure
    # can also slow scenario settle windows, so this pads further than
    # sibling jobs' ~1.7x ratio.
    timeout-minutes: 24
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Build Simulation
        run: go build -race -o tmp/simulation ./test/simulation/cmd/simulation
      - name: Run Label Assignment Scenarios
        run: |
          set -eo pipefail
          for scn in label_pool_outage_spill label_tight_takeover_churn label_emergency_carveout label_relabel_storm; do
            echo "::group::${scn}"
            ./tmp/simulation \
              --config "test/simulation/configs/${scn}.yaml" \
              --stop-on-failure=false \
              2>&1 | tee "tmp/${scn}.log"
            echo "::endgroup::"
          done
      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-label-assignment-failure
          path: |
            failure_report.json
            tmp/label_*.log
