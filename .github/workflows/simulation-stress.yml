name: Simulation Stress Test

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chaos-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build Simulation
        run: go build -o tmp/simulation ./test/simulation/cmd/simulation

      - name: Run Chaos Simulation
        run: |
          # Run for 8 minutes with comprehensive chaos
          ./tmp/simulation \
            --config test/simulation/configs/chaos_comprehensive.yaml \
            --duration 8m \
            --cooldown 90s \
            --stop-on-failure=false \
            2>&1 | tee tmp/simulation.log

      - name: Upload Failure Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-report
          path: |
            failure_report.json
            tmp/simulation.log
