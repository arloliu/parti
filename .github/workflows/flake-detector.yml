name: Flake Detector (non-blocking)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC

permissions:
  contents: read

jobs:
  flake-detector:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true # non-blocking monitor
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod


      - name: Run flake detector (unit only, race)
        env:
          MAX_RUNS: '10'
          TEST_SET: unit
          RACE: '1'
          PARALLELISM: '4'
          TEST_TIMEOUT: 6m
        run: |
          bash scripts/flake_detector.sh

      - name: Summarize
        if: always()
        run: |
          echo "Flake detector completed (non-blocking). Inspect job logs for failures or flakes."
