# Minimal NATS JetStream configuration for the IOPS investigation rig.
# Per-node identity is injected via the SERVER_NAME environment variable.
# The cluster route list names all 5 potential nodes; NATS silently ignores
# routes to containers that are not running (e.g. nats-4 and nats-5 when
# the r3 profile is active).

server_name: $SERVER_NAME

jetstream {
  store_dir: /data
}

http_port: 8222

cluster {
  name: iops-rig
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats-1:6222
    nats-route://nats-2:6222
    nats-route://nats-3:6222
    nats-route://nats-4:6222
    nats-route://nats-5:6222
  ]
}
