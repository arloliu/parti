# NATS JetStream config for the IOPS rig — metacontroller snapshot sweep.
# Identical to nats-server.conf except the JetStream block sets
# meta_compact_size: 16MB (design §8.1: metacontroller snapshot sweep).
# NOTE: the value is UNQUOTED on purpose — nats-server 2.12.6 parses a quoted
# "16MB" as the broken literal `16M` (strconv.ParseInt error); unquoted 16MB
# parses to 16777216 bytes. Verified with `nats-server -c <conf> -t`.
# Per-node identity is injected via the SERVER_NAME environment variable.
#
# Cluster route list: only nats-1 is named as the seed. NATS discovers
# every other peer dynamically via gossip after the first route connection,
# so the same conf works unchanged for r3 (3 nodes) and r5 (5 nodes).

server_name: $SERVER_NAME

jetstream {
  store_dir: /data
  meta_compact_size: 16MB
}

http_port: 8222

cluster {
  name: iops-rig
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats-1:6222
  ]
}
