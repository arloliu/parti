# NATS JetStream configuration for Plan 02 cell M2.C.
#
# Identical to nats-server.conf except for the jetstream.sync_interval
# override, raised from the default (2m) to 10m. This is the
# IOPS-reduction direction per Plan 02 R1 §1.3 / §3:
# - Lowering sync_interval (toward "always") increases IOPS.
# - Raising it past the default reduces explicit-fsync-driven writeback
#   bursts at the cost of widening the data-loss window on coordinated
#   power loss from ~2m to ~10m. Messages remain durable across single-
#   node failures (R=3 stream replication is unchanged).
#
# Mount-path selection: docker-compose.yaml reads
# ${IOPS_RIG_NATS_CONFIG:-./nats-server.conf}; set
# IOPS_RIG_NATS_CONFIG=./nats-server-M2C.conf before `docker compose up`
# to bring up the cluster with this file mounted instead.

server_name: $SERVER_NAME

jetstream {
  store_dir: /data
  sync_interval: "10m"
}

http_port: 8222

cluster {
  name: iops-rig
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats-1:6222
  ]
}
