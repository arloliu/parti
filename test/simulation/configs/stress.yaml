simulation:
  duration: 12h
  mode: all-in-one

partitions:
  count: 1500
  message_rate_per_partition: 0.1
  distribution: exponential
  weights:
    exponential:
      extreme_percent: 0.05    # 5% of partitions get extreme weight
      extreme_weight: 100      # Extreme partitions get weight 100
      normal_weight: 1         # Normal partitions get weight 1

producers:
  count: 10
  rate_variation:
    enabled: true
    pattern: global
    min_multiplier: 0.5  # Scale down to 50% of base rate
    max_multiplier: 2.0  # Scale up to 200% of base rate
    ramp_interval: 5m    # Change rate every 5 minutes

workers:
  count: 50
  assignment_strategy: WeightedConsistentHash
  strategy_config:
    virtual_nodes: 150  # For consistent hashing
  processing_delay:
    min: 10ms
    max: 100ms
  # Throughput knobs
  consumer_batch_size: 16
  handler_concurrency: 1
  # Override subject guardrail to avoid cap errors with 1500 partitions (defaults to partition count if 0)
  max_subjects: 1500
  # Enforce exclusive processing to prevent gaps during handoff/chaos
  enforce_exclusive_consumption: true
  processing_gate:
    # Warm-up phase: stable-only to avoid early duplicates
    warmup_duration: 5s
    warmup_allowed_states: ["stable"]
    # Steady-state: allow commit+stable for throughput
    allowed_states: ["commit", "stable"]
    nak_delay: 50ms
    nak_jitter: 0.3
    debug: false

coordinator:
  validation_window: 10m
  dup_trace:
    enabled: true
    window: 30s
    threshold_per_min: 1.0
    top_n: 10
  gap_aging: 60s
  slo:
    enable_catch_up: true
    catch_up_deadline: 30s
    catch_up_percent: 99
    absence_threshold: 5s

chaos:
  enabled: true
  events:
    - worker_crash
    - worker_restart
    - scale_up
    - scale_down
    - leader_failure
    - producer_crash
    - network_disconnect
    - worker_pause
  interval: 1m-2m   # More frequent chaos

nats:
  mode: embedded
  url: "nats://localhost:4222"
  jetstream:
    max_memory: 4GB
    max_storage: 2GB

metrics:
  prometheus:
    enabled: true
    port: 9091  # Use 9091 to avoid conflict with Prometheus container

checkpoint:
  enabled: true
  interval: 15m  # More frequent checkpoints under stress
  path: "./checkpoints"
