simulation:
  duration: 2m
  mode: all-in-one

nats:
  mode: embedded

partitions:
  count: 50
  message_rate_per_partition: 5
  distribution: uniform

producers:
  count: 2

workers:
  count: 10
  assignment_strategy: WeightedConsistentHash
  processing_delay:
    min: 1ms
    max: 5ms
  # Processing Gate is deliberately OFF in this config — adding it
  # alongside the aggressive 15-25s chaos interval, burst-enabled
  # bursts, and 8m duration creates sustained NAK loops that prevent
  # the cluster from draining (empirically: ~40% of messages
  # undelivered under gate-on + comprehensive chaos in local 8m runs).
  # The gate-on CI signal lives on chaos_gate.yaml under a lighter
  # workload (see .github/workflows/simulation-stress.yml's
  # gate-on-simulation job).

chaos:
  enabled: true
  interval: "15s-25s"
  min_workers: 8
  max_workers: 14
  burst_enabled: true
  burst_probability: 0.3
  events:
    - worker_crash
    - worker_restart
    - leader_failure
    - producer_crash
    - scale_down
    - scale_up
    - worker_pause
    - network_disconnect
    - network_disconnect_leader
    - slow_consumer

coordinator:
  # 240s gives post-burst drains enough runway when chaos reassigns partitions
  # while a slow_consumer event is still active. Prior value (180s) produced
  # flaky unresolved-gap failures under aggressive chaos combinations.
  gap_aging: 240s
  slo:
    enable_catch_up: true
    catch_up_deadline: 30s
    catch_up_percent: 99
    absence_threshold: 5s

metrics:
  prometheus:
    enabled: false
