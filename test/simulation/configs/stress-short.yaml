simulation:
  duration: 10m
  mode: all-in-one

partitions:
  count: 1500
  message_rate_per_partition: 0.1
  distribution: exponential
  weights:
    exponential:
      extreme_percent: 0.05
      extreme_weight: 100
      normal_weight: 1

producers:
  count: 10
  rate_variation:
    enabled: true
    pattern: global
    min_multiplier: 0.5
    max_multiplier: 2.0
    ramp_interval: 5m

workers:
  count: 50
  assignment_strategy: WeightedConsistentHash
  strategy_config:
    virtual_nodes: 150
  processing_delay:
    min: 10ms
    max: 100ms
  consumer_batch_size: 16
  handler_concurrency: 1
  max_subjects: 1500
  enforce_exclusive_consumption: true
  processing_gate:
    warmup_duration: 10s
    warmup_allowed_states: ["stable"]
    # Restrict steady-state to stable only to minimize duplicates under churn
    allowed_states: ["stable"]
    nak_delay: 50ms
    nak_jitter: 0.3
    debug: false

coordinator:
  validation_window: 10m
  dup_trace:
    enabled: true
    window: 30s
    threshold_per_min: 1.0
    top_n: 10
  gap_aging: 60s
  slo:
    enable_catch_up: true
    hole_max_age: 20s
    # Lower absence threshold to detect restarts/crashes quickly
    absence_threshold: 3s
    # Deadline tighter to classify slow recoveries
    catch_up_deadline: 45s
    catch_up_percent: 0  # 0 means 100% healing required

chaos:
  enabled: true
  events:
    - worker_crash      # longer downtime to build backlog
    - worker_restart
    - worker_pause      # pause processing without reassignment to accumulate holes
    - scale_up
    - scale_down
  interval: 25s-35s    # faster chaos to exercise catch-up within short test

nats:
  mode: embedded
  url: "nats://localhost:4222"
  jetstream:
    max_memory: 4GB
    max_storage: 2GB

metrics:
  prometheus:
    enabled: true
    port: 9091

checkpoint:
  enabled: false
  interval: 15m
  path: "./checkpoints"
