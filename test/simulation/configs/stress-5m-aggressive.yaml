simulation:
  duration: 7m
  mode: all-in-one

partitions:
  count: 600
  message_rate_per_partition: 1.5
  distribution: exponential
  weights:
    exponential:
      extreme_percent: 0.05
      extreme_weight: 100
      normal_weight: 1

producers:
  count: 12
  rate_variation:
    enabled: true
    pattern: global
    min_multiplier: 0.3
    max_multiplier: 3.0
    ramp_interval: 30s

workers:
  count: 12
  assignment_strategy: WeightedConsistentHash
  strategy_config:
    virtual_nodes: 80
  processing_delay:
    min: 20ms
    max: 350ms
  consumer_batch_size: 32
  handler_concurrency: 2
  max_subjects: 600
  enforce_exclusive_consumption: true
  processing_gate:
    warmup_duration: 10s
    warmup_allowed_states: ["stable"]
    allowed_states: ["stable"]
    nak_delay: 60ms
    nak_jitter: 0.4
    debug: false

coordinator:
  validation_window: 7m
  dup_trace:
    enabled: true
    window: 30s
    threshold_per_min: 2.0
    top_n: 10
  gap_aging: 20s

chaos:
  enabled: true
  events:
    - scale_up
    - scale_down
  interval: 45s-75s

nats:
  mode: embedded
  url: "nats://localhost:4222"
  jetstream:
    max_memory: 2GB
    max_storage: 2GB

metrics:
  prometheus:
    enabled: false
    port: 9091

checkpoint:
  enabled: false
  interval: 15m
  path: "./checkpoints"