# Minimal NATS JetStream configuration for the IOPS investigation rig.
# Per-node identity is injected via the SERVER_NAME environment variable.
#
# Cluster route list: only nats-1 is named as the seed. NATS discovers
# every other peer dynamically via gossip after the first route connection,
# so the same conf works unchanged for r3 (3 nodes) and r5 (5 nodes).
# An earlier revision named all 5 nodes statically; that produced
# DNS-resolution errors for nats-4 / nats-5 under the r3 profile and
# prevented the JetStream meta-cluster from electing a leader (verified
# empirically against nats:2.12.6 + docker compose v5.1).

server_name: $SERVER_NAME

jetstream {
  store_dir: /data
}

http_port: 8222

cluster {
  name: perf-rig
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats-1:6222
  ]
}
