# NATS JetStream config for the IOPS rig — metacontroller snapshot sweep.
# Identical to nats-server.conf except the JetStream block sets
# meta_compact_size: 1MB (downward sweep: exercise compaction at a threshold
# the meta WAL actually crosses at N>=5000, where peak pending_size is ~2-6MB).
# NOTE: the value is UNQUOTED on purpose — nats-server 2.12.6 parses a quoted
# "1MB" as a broken literal; unquoted 1MB parses to bytes. Verified with
# `nats-server -c <conf> -t`. Per-node identity via SERVER_NAME env var.

server_name: $SERVER_NAME

jetstream {
  store_dir: /data
  meta_compact_size: 1MB
}

http_port: 8222

cluster {
  name: perf-rig
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats-1:6222
  ]
}
