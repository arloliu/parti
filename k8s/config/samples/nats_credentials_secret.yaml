apiVersion: v1
kind: Secret
metadata:
  name: sample-nats-creds
  namespace: default
# Use stringData so the placeholder is human-readable.
# Replace the value below with the actual NATS .creds file content before use.
stringData:
  credentials: |
    -----BEGIN NATS USER JWT-----
    <replace-with-actual-jwt>
    ------END NATS USER JWT------

    -----BEGIN USER NKEY SEED-----
    <replace-with-actual-nkey-seed>
    ------END USER NKEY SEED------
